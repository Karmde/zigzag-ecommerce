<!-- ═══════════════ SEARCH PANEL ═══════════════ -->
<div id="search-panel">
    <div id="search-panel-content">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bbb"
                stroke-width="1.8">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input id="search-input" type="text" placeholder="Search for products, brands, categories…" autocomplete="off" />
            <button onclick="closeSearch()"
                style="background:none;border:none;cursor:pointer;color:#bbb;font-size:28px;line-height:1;padding:0;margin-left:auto;"
                aria-label="Close">×</button>
        </div>

        <div id="search-suggestions" style="display:grid;grid-template-columns:1fr 1fr;gap:32px;">
            <div>
                <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a8a8a;margin-bottom:14px;">
                    Trending Searches</div>
                <div style="display:flex;flex-wrap:wrap;gap:8px;" class="suggestion-tags">
                    <a class="trending-tag">iPhone 16 Pro</a>
                    <a class="trending-tag">Nike Air Max</a>
                    <a class="trending-tag">Smart Watch</a>
                    <a class="trending-tag">Winter Jackets</a>
                    <a class="trending-tag">Wireless Earbuds</a>
                    <a class="trending-tag">Yoga Mat</a>
                    <a class="trending-tag">Coffee Maker</a>
                    <a class="trending-tag">Running Shoes</a>
                </div>
            </div>
            <div>
                <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#898888;margin-bottom:14px;">
                    Popular Brands</div>
                <div style="display:flex;flex-wrap:wrap;gap:8px;" class="suggestion-tags">
                    <a class="trending-tag">Apple</a>
                    <a class="trending-tag">Nike</a>
                    <a class="trending-tag">Samsung</a>
                    <a class="trending-tag">Sony</a>
                    <a class="trending-tag">Adidas</a>
                    <a class="trending-tag">Levi's</a>
                </div>
            </div>
        </div>

        <div id="search-results" style="display:none;">
            <div id="search-results-list"></div>
            <div id="search-no-results" style="display:none;color:#888;padding:20px 0;text-align:center;">
                No products found matching your search.
            </div>
        </div>

        <div id="search-loading" style="display:none;color:#888;padding:20px 0;text-align:center;">
            Searching...
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('search-input');
    const suggestionsEl = document.getElementById('search-suggestions');
    const resultsEl = document.getElementById('search-results');
    const resultsList = document.getElementById('search-results-list');
    const noResultsEl = document.getElementById('search-no-results');
    const loadingEl = document.getElementById('search-loading');
    let debounceTimer;
    let categoryNames = new Set();
    let categoryNameMap = {};

    async function loadCategories() {
        try {
            const res = await fetch('/catalog/categories');
            if (!res.ok) return;
            const data = await res.json();
            categoryNames = new Set();
            categoryNameMap = {};
            data.forEach(c => {
                const name = c.name.toLowerCase();
                categoryNames.add(name);
                categoryNameMap[name] = c.name;
            });
        } catch (e) {
            console.error('Failed to load categories', e);
        }
    }

    function openSearch() {
        const panel = document.getElementById('search-panel');
        panel.classList.add('open');
        searchInput.value = '';
        suggestionsEl.style.display = 'grid';
        resultsEl.style.display = 'none';
        noResultsEl.style.display = 'none';
        resultsList.innerHTML = '';
        searchInput.focus();
        document.body.style.overflow = 'hidden';
        loadCategories();
    }

    function closeSearch() {
        document.getElementById('search-panel').classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('search-btn')?.addEventListener('click', openSearch);
    document.getElementById('mobile-search-btn')?.addEventListener('click', openSearch);
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeSearch();
    });

    document.getElementById('search-panel').addEventListener('click', e => {
        if (e.target.id === 'search-panel') closeSearch();
    });

    document.querySelectorAll('.suggestion-tags .trending-tag').forEach(tag => {
        tag.addEventListener('click', () => {
            const query = tag.textContent.trim();
            window.location.href = `/catalog?q=${encodeURIComponent(query)}`;
        });
    });

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();
        clearTimeout(debounceTimer);

        if (!query) {
            suggestionsEl.style.display = 'grid';
            resultsEl.style.display = 'none';
            noResultsEl.style.display = 'none';
            loadingEl.style.display = 'none';
            return;
        }

        loadingEl.style.display = 'block';
        suggestionsEl.style.display = 'none';
        resultsEl.style.display = 'none';
        noResultsEl.style.display = 'none';

        debounceTimer = setTimeout(() => runSearch(query), 300);
    });

    searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            clearTimeout(debounceTimer);
            const query = searchInput.value.trim();
            if (query) {
                const lower = query.toLowerCase();
                if (categoryNames.has(lower)) {
                    window.location.href = `/catalog?category_name=${encodeURIComponent(categoryNameMap[lower])}`;
                } else {
                    window.location.href = `/catalog?q=${encodeURIComponent(query)}`;
                }
            }
        }
    });

    async function runSearch(query) {
        try {
            const res = await fetch(`/search?q=${encodeURIComponent(query)}&limit=20&offset=0`);
            if (!res.ok) throw new Error('Search failed');
            const data = await res.json();
            renderResults(data.results || [], data.total || 0);
        } catch (err) {
            console.error(err);
            resultsList.innerHTML = '<div style="color:#888;padding:20px 0;text-align:center;">Something went wrong. Try again.</div>';
            resultsEl.style.display = 'block';
            loadingEl.style.display = 'none';
        }
    }

    function renderResults(results, total) {
        loadingEl.style.display = 'none';
        resultsList.innerHTML = '';

        if (results.length === 0) {
            noResultsEl.style.display = 'block';
            resultsEl.style.display = 'block';
            return;
        }

        noResultsEl.style.display = 'none';
        results.forEach(item => {
            const card = document.createElement('a');
            card.href = `/product?id=${item.product_id}`;
            card.style.cssText = 'display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #f0f0f0;text-decoration:none;color:inherit;';
            card.innerHTML = `
                <div style="width:60px;height:60px;border-radius:8px;background:#f5f5f5;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:24px;">
                    ${item.main_image ? `<img src="${item.main_image}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" />` : '📦'}
                </div>
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</div>
                    <div style="font-size:13px;color:#888;">
                        ${item.brand_name ? item.brand_name + ' · ' : ''}₹${Number(item.base_price).toLocaleString('en-IN')}
                        ${item.discount_percent > 0 ? ` <span style="color:#e5484d;">(${item.discount_percent}% off)</span>` : ''}
                    </div>
                </div>
            `;
            resultsList.appendChild(card);
        });

        if (total > results.length) {
            const viewAll = document.createElement('a');
            const query = searchInput.value.trim();
            const lower = query.toLowerCase();
            const href = categoryNames.has(lower)
                ? `/catalog?category_name=${encodeURIComponent(categoryNameMap[lower])}`
                : `/catalog?q=${encodeURIComponent(query)}`;
            viewAll.href = href;
            viewAll.style.cssText = 'display:block;text-align:center;padding:16px 0;color:#111;font-weight:500;text-decoration:none;border-top:1px solid #f0f0f0;margin-top:8px;';
            viewAll.textContent = `View all ${total} results →`;
            resultsList.appendChild(viewAll);
        }

        resultsEl.style.display = 'block';
    }
</script>
