<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main-header.modal-hidden {
            display: none !important;
        }
    </style>
</head>

<body class="bg-white">

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[9999]" style="display: none;" aria-hidden="true">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" onclick="addressesJS.closeDeleteModal()"></div>
        <div class="relative flex min-h-full items-center justify-center p-4 sm:p-6">
            <div class="relative w-full max-w-md overflow-hidden bg-white shadow-2xl" onclick="event.stopPropagation()">
                <div class="px-6 py-8 sm:px-8">
                    <div class="flex flex-col items-center text-center">
                        <div class="flex h-12 w-12 items-center justify-center rounded-full border border-black/10 bg-black/[0.03]">
                            <svg class="h-6 w-6 text-black/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                            </svg>
                        </div>
                        <h2 class="mt-5 text-lg font-semibold tracking-tight">Delete Address</h2>
                        <p class="mt-2 text-sm text-black/55">Are you sure you want to delete this address? This action cannot be undone.</p>
                    </div>
                </div>
                <div class="flex flex-col-reverse gap-3 border-t border-black/10 px-6 py-5 sm:flex-row sm:justify-end sm:px-8">
                    <button type="button" onclick="addressesJS.closeDeleteModal()" class="h-11 border border-black/15 px-6 text-sm font-medium transition hover:border-black hover:bg-black/5">Cancel</button>
                    <button type="button" onclick="addressesJS.confirmDelete()" class="h-11 bg-black px-7 text-sm font-medium text-white transition hover:bg-black/85">Delete</button>
                </div>
            </div>
        </div>
    </div>

    {% include 'partials/header.html' %}
    <main class="min-h-screen bg-white text-black">

        <!-- Page Header -->
        <section class="mx-auto max-w-7xl px-6 py-14 lg:px-8">

            <div
                class="mb-12 flex flex-col justify-between gap-6 border-b border-black/10 pb-8 sm:flex-row sm:items-end">
                <div>
                    <p class="mb-3 text-xs font-medium uppercase tracking-[0.25em] text-black/50">
                        Account
                    </p>

                    <h1 class="text-4xl font-semibold tracking-tight sm:text-5xl">
                        Your Addresses
                    </h1>

                    <p class="mt-3 max-w-xl text-sm leading-6 text-black/55">
                        Manage your saved delivery addresses and choose your default
                        delivery location.
                    </p>
                </div>

                <!-- Add Address -->
                <button type="button" onclick="addressesJS.openAddressModal()"
                    class="group inline-flex h-12 items-center justify-center gap-3 bg-black px-6 text-sm font-medium text-white transition hover:bg-black/85">
                    <svg class="h-4 w-4 transition-transform duration-300 group-hover:rotate-90" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
                    </svg>

                    Add New Address
                </button>
            </div>


            <!-- Address List -->
            <div id="address-list" class="grid grid-cols-1 gap-5 lg:grid-cols-2">
                <!-- Addresses will be loaded dynamically -->
            </div>

        </section>

    </main>

    <!-- Add Address Modal -->
    {% include 'user/add-address-modal.html' %}
    
    <script src="/js/addresses.js"></script>
</body>

</html>
